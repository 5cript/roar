name: build-and-test

on:
  push:
    branches: ["master", "devel"]
  pull_request:
    branches: ["master"]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  ubuntu:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
      - uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: libcurl4-openssl-dev libcrypto++-dev ninja-build

      - name: Install boost
        uses: MarkusJx/install-boost@v2.4.5
        id: install-boost
        with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here:
          # https://github.com/MarkusJx/prebuilt-boost/blob/main/versions-manifest.json
          boost_version: 1.87.0
          # OPTIONAL: Specify a platform version
          platform_version: 22.04

      - name: Dump Tooling Versions
        run: |
          clang++ --version
          cmake --version
          ninja --version

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build/clang_${{env.BUILD_TYPE}} -G"Ninja" -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_CXX_FLAGS="-stdlib=libc++" -DROAR_BUILD_TESTS=on -DCMAKE_CXX_EXTENSIONS=on -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DCMAKE_LINKER=lld -DCMAKE_CXX_STANDARD=20
        env:
          Boost_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}

      - name: Build
        run: cmake --build ${{github.workspace}}/build/clang_${{env.BUILD_TYPE}} --config ${{env.BUILD_TYPE}}

      - name: Test
        working-directory: ${{github.workspace}}/build/clang_${{env.BUILD_TYPE}}
        run: ./tests/bin/roar-tests

  windows-msys2:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v3
      - uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          release: true
          install: mingw-w64-clang-x86_64-clang make unzip mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-boost mingw-w64-clang-x86_64-crypto++ libcurl mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-nlohmann-json

      - name: Workspace Path Fixup
        run: echo "WSPACE=$(cygpath '${{github.workspace}}')" >> $GITHUB_ENV

      - name: Configure CMake
        run: >
            cmake
            -B ${{env.WSPACE}}/build/clang_${{env.BUILD_TYPE}}
            -G"Ninja"
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
            -DROAR_BUILD_TESTS=on
            -DCMAKE_CXX_EXTENSIONS=on
            -DCMAKE_CXX_COMPILER=clang++
            -DCMAKE_C_COMPILER=clang
            -DCMAKE_LINKER=lld
            -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build ${{env.WSPACE}}/build/clang_${{env.BUILD_TYPE}} --config ${{env.BUILD_TYPE}}

  macos:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v3

      - run: brew install ninja boost cryptopp curl llvm@19 lld@19

      - name: Get LLVM Paths
        run: |
          echo "BREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV
          echo "LLVM_PREFIX=$(brew --prefix llvm@19)" >> $GITHUB_ENV

      - name: Configure CMake
        run: >
          cmake
          -DCMAKE_C_COMPILER=${{env.LLVM_PREFIX}}/bin/clang
          -DCMAKE_CXX_COMPILER=${{env.LLVM_PREFIX}}/bin/clang++
          -DCMAKE_LINKER=${{env.BREW_PREFIX}}/opt/lld@19/bin/lld
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -nostdinc++ -I${{env.LLVM_PREFIX}}/include/c++/v1 -I${{env.LLVM_PREFIX}}/lib/clang/19/include"
          -DCMAKE_C_FLAGS="-I${{env.LLVM_PREFIX}}/lib/clang/19/include"
          -DCMAKE_EXE_LINKER_FLAGS="-L${{env.LLVM_PREFIX}}/lib/c++ -L${{env.LLVM_PREFIX}}/lib/unwind -lunwind -Wl,-rpath,${{env.LLVM_PREFIX}}/lib/c++"
          -DROAR_BUILD_TESTS=on
          -S ${{github.workspace}}
          -B ${{github.workspace}}/build/clang_${{env.BUILD_TYPE}}
          -G"Ninja"
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DBREW_PREFIX="${{env.BREW_PREFIX}}"
          -DCMAKE_CXX_EXTENSIONS=on
          -DCMAKE_CXX_STANDARD=20

      - name: Build
        run: cmake --build ${{github.workspace}}/build/clang_${{env.BUILD_TYPE}} --config ${{env.BUILD_TYPE}}